name: CI

on:
  push:
    branches: [main, master, feature/orbit-island]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR when new commits land.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed git clang

      - uses: actions/checkout@v6

      - name: Check formatting
        run: |
          mapfile -d '' files < <(find src \( -name '*.cpp' -o -name '*.h' \) -print0)
          clang-format --dry-run -Werror "${files[@]}"

  build:
    name: Build (debug)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git meson ninja pkgconf \
            wayland wayland-protocols \
            libglvnd freetype2 fontconfig noto-fonts \
            cairo pango harfbuzz \
            libxkbcommon glib2 \
            libsecret libsodium \
            sdbus-cpp libpipewire wireplumber polkit \
            pam curl libwebp libjxl libsndfile librsvg \
            libqalculate libxml2 \
            md4c tomlplusplus libical \
            nlohmann-json stb \
            jemalloc just clang dbus python

      - uses: actions/checkout@v6

      - name: Build
        run: just build

      - name: Test
        run: just test debug --print-errorlogs

      - name: Check translations and setup scripts
        run: |
          python3 tools/i18n-check.py
          python3 tests/desktop_setup_test.py
          python3 -m unittest discover -s .github/workflows/scripts -p 'test_*.py'

      - name: Lint
        run: just lint
