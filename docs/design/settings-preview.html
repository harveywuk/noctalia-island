<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noctalia Settings — layout preview</title>
<style>
:root{color-scheme:dark;--bg:#19191f;--side:#23232bcc;--card:#28282f;--line:#ffffff12;--text:#f3f1f8;--muted:#aaa6b6;--accent:#bbabf5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#514265,transparent 60%),#202733;color:var(--text);font:14px system-ui,sans-serif;min-height:100vh;padding:7vh 4vw}button,input,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.window{max-width:1080px;height:740px;max-height:86vh;margin:auto;display:grid;grid-template-columns:240px 1fr;border:1px solid #ffffff20;border-radius:17px;overflow:hidden;box-shadow:0 28px 80px #0007;background:var(--bg)}aside{background:var(--side);padding:25px 14px;overflow:auto;border-right:1px solid var(--line)}.brand{font-size:17px;font-weight:650;padding:0 10px 6px}.tag{font-size:11px;color:var(--muted);padding:0 10px 24px}input[type=search]{width:100%;background:#10101560;color:var(--text);border:1px solid #ffffff0e;border-radius:8px;padding:9px 11px;margin-bottom:23px}nav p{font-size:11px;font-weight:650;color:var(--muted);margin:18px 11px 8px}nav button{width:100%;background:none;border:0;border-radius:7px;padding:9px 10px;display:flex;align-items:center;gap:10px;text-align:left;margin:2px 0}nav button[aria-current=page]{background:#a891ef26}nav button:hover{background:#ffffff0c}.icon{display:grid;place-items:center;width:25px;height:25px;background:#7761a4;border:1px solid #ffffff25;border-radius:6px;font-size:15px}.blue{background:#477da8}.green{background:#508c76}.pink{background:#a76a8a}main{min-width:0;overflow:auto}header{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:22px 30px;background:#19191ff5;border-bottom:1px solid var(--line);z-index:1}header button{background:#ffffff08;border:1px solid var(--line);border-radius:7px;width:30px;height:30px}h1{font-size:20px;margin:0;font-weight:650}.body{max-width:740px;margin:auto;padding:28px 32px 36px}.intro{color:var(--muted);line-height:1.6;margin:0 0 24px}.section{font-size:12px;font-weight:600;color:var(--muted);margin:25px 2px 9px}.card{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}.row{display:flex;align-items:center;justify-content:space-between;gap:22px;min-height:61px;padding:13px 17px}.row+.row{border-top:1px solid var(--line)}.row small{display:block;color:var(--muted);font-size:12px;line-height:1.5;margin-top:3px}.row>div{min-width:0}.link{width:100%;border:0;background:none;text-align:left}.link:hover{background:#ffffff05}.value{display:flex;align-items:center;gap:13px;color:var(--muted);white-space:nowrap;font-size:13px}.chevron{font-size:20px;color:#85808e}select{background:#ffffff08;color:var(--text);border:1px solid #ffffff16;border-radius:6px;padding:6px 8px;max-width:195px}option{background:var(--card)}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:14px}.actions button{background:#ffffff08;border:1px solid #ffffff1c;border-radius:7px;padding:7px 12px;font-size:12px}.actions button:disabled{opacity:.4;cursor:default}.note{font-size:12px;color:var(--muted);line-height:1.55;margin:12px 3px}.switch{appearance:none;width:34px;height:21px;flex:0 0 34px;border-radius:20px;background:#5c5964;position:relative;cursor:pointer}.switch:before{content:'';position:absolute;height:17px;width:17px;background:white;border-radius:50%;top:2px;left:2px;transition:transform .12s}.switch:checked{background:#a18bcf}.switch:checked:before{transform:translateX(13px)}.badge{font-size:10px;background:#bba7e724;color:#cfbff3;padding:3px 7px;border-radius:4px}.preview{padding-top:28px;font-size:11px;color:#8c8799;line-height:1.6}.search-path{color:var(--muted);font-size:12px}.empty{color:var(--muted);padding:24px}@media(max-width:700px){body{padding:0}.window{height:100dvh;max-height:none;border-radius:0;grid-template-columns:170px 1fr}aside{padding:22px 8px}.body{padding:20px 16px}header{padding:20px 16px}.row{gap:10px;flex-wrap:wrap}select{max-width:100%}}
</style>
<div class="window">
<aside><div class="brand">Noctalia</div><div class="tag">SETTINGS · DESIGN PREVIEW</div><input id="search" type="search" placeholder="Search settings" aria-label="Search settings"><nav id="nav"></nav></aside>
<main><header><button id="back" aria-label="Go back">‹</button><h1 id="title"></h1></header><div class="body" id="content"></div></main>
</div>
<script>
const sections=[['Personalise',[['appearance','Appearance','◐',''],['island','Dynamic Island','◒','pink']]],['Devices',[['displays','Displays','▣','blue'],['input','Mouse & Trackpad','↖','green']]],['General',[['system','System','⚙','']]]];
const pages={system:{title:'System',parent:null,html:()=>`<p class="intro">Everyday preferences for your desktop.</p><div class="card">${link('Default applications','Browser, email, files and terminal','defaults')}${link('Backups','Save and restore your setup','backups')}</div><p class="preview">Layout study: these controls use sample values and do not change your desktop.</p>`},defaults:{title:'Default applications',parent:'system',html:()=>`<p class="intro">Choose which applications open your links and files.</p><div class="card">${select('Web browser','Web links and HTML documents','browser',['Firefox','Chromium'])}${select('Email','Email links','email',['Thunderbird','Geary'])}${select('File manager','Folders','files',['Dolphin','Thunar'])}${select('Text editor','Plain text files','text',['Kate','GNOME Text Editor'])}${select('PDF viewer','PDF documents','pdf',['Okular','Document Viewer'])}</div><div class="actions"><button id="undo" ${undo?'':'disabled'}>Undo app change</button></div><p class="section">Terminal</p><div class="card">${select('Preferred terminal','For applications opened through Noctalia','terminal',['Automatic discovery','Ghostty','Kitty'])}</div><p class="note">Hyprland shortcuts with their own terminal command keep that choice.</p>`},island:{title:'Dynamic Island',parent:null,html:()=>`<p class="intro">A quiet home for live activity, media and quick controls.</p><div class="card">${toggle('Enable Dynamic Island','Show the Island on your desktop','enabled')}${link('Content & behaviour','Activities, cycling and battery indicators','activity')}</div><p class="section">Layout</p><div class="card">${select('Position','','position',['Top centre','Top left','Top right'])}${select('Visibility','','visibility',['Smart hide','Always visible','Auto-hide'])}${link('Monitor overrides','Use a different setup on each display','monitors')}</div><p class="note">The default layout applies to every display without an override.</p>`},activity:{title:'Content & behaviour',parent:'island',html:()=>`<div class="card">${toggle('Cycle activities','Rotate between eligible activities','cycle')}${select('Cycle interval','','interval',['5 seconds','10 seconds','15 seconds'])}</div><p class="section">Bluetooth battery</p><div class="card">${select('Show after connection','','battery',['5 seconds','10 seconds'])}${toggle('Show on hover','Reveal the battery ring when you hover','hover')}${toggle('Keep low battery visible','Keep the ring visible when the battery is low','low')}</div>`},monitors:{title:'Monitor overrides',parent:'island',html:()=>`<p class="intro">Choose a display to customise its Island layout.</p><div class="card">${link('DP-1','Uses default layout','monitor')}${link('DP-2','Uses default layout','monitor')}</div><p class="note">Display names here are illustrative.</p>`},monitor:{title:'Display override',parent:'monitors',html:()=>`<div class="card">${toggle('Use default layout','Inherit the Dynamic Island settings','inherit')}${select('Visibility','','monitorVisibility',['Smart hide','Always visible','Auto-hide'])}</div>`},appearance:{title:'Appearance',parent:null,html:()=>`<p class="intro">Make Noctalia feel at home on your desktop.</p><div class="card">${select('Colour mode','','mode',['Dark','Light','Follow system'])}${select('Accent colour','','accent',['Lavender','Blue','Rose'])}${toggle('Window shadows','','shadow')}${toggle('Reduce motion','Use simpler transitions','motion')}</div><p class="note">The new layout would continue to use your Noctalia theme and fonts.</p>`},displays:{title:'Displays',parent:null,html:()=>`<p class="intro">Display controls belong together on one focused page.</p><div class="card">${select('Display','','display',['DP-1','DP-2'])}${select('Resolution','','resolution',['3440 × 1440','2560 × 1440'])}${select('Refresh rate','','rate',['165 Hz','120 Hz','60 Hz'])}${select('Variable refresh rate','','vrr',['Automatic','Enabled','Disabled'])}${select('Colour management','','colour',['sRGB','Wide gamut'])}${select('Rotation','','rotation',['Landscape','Portrait'])}</div><p class="note">In the working panel, changes would retain the existing timed Keep / Revert confirmation.</p>`},input:{title:'Mouse & Trackpad',parent:null,html:()=>`<div class="card">${toggle('Natural scrolling','','natural')}${toggle('Tap to click','','tap')}${toggle('Disable trackpad while typing','','typing')}${select('Scroll speed','','speed',['Normal','Slow','Fast'])}</div>`},backups:{title:'Backups',parent:'system',html:()=>`<p class="intro">Keep a saved copy of a setup you like.</p><div class="card"><div class="row"><div>My desktop<small>Example backup · Appearance, bars and input</small></div><span class="badge">SAVED</span></div></div><p class="note">The working panel would keep scoped preview, automatic undo and display confirmation.</p>`}};
let current='defaults',history=[],values={},undo=null;
const escape=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
function link(label,desc,dest){return `<button class="row link" data-page="${dest}"><div>${label}<small>${desc}</small></div><span class="chevron">›</span></button>`}
function select(label,desc,key,opts){return `<div class="row"><div>${label}${desc?`<small>${desc}</small>`:''}</div><select aria-label="${label}" data-key="${key}">${opts.map(o=>`<option ${values[key]===o?'selected':''}>${o}</option>`).join('')}</select></div>`}
function toggle(label,desc,key){return `<label class="row"><div>${label}${desc?`<small>${desc}</small>`:''}</div><input class="switch" type="checkbox" data-key="${key}" ${values[key]!==false?'checked':''}></label>`}
function root(p){return pages[p].parent?root(pages[p].parent):p}
function render(){const q=document.querySelector('#search').value.trim().toLowerCase();document.querySelector('#nav').innerHTML=sections.map(([group,items])=>`<p>${group}</p>${items.map(([id,label,icon,colour])=>`<button data-page="${id}" ${root(current)===id?'aria-current="page"':''}><span class="icon ${colour}">${icon}</span>${label}</button>`).join('')}`).join('');document.querySelector('#title').textContent=q?'Search results':pages[current].title;document.querySelector('#back').disabled=!q&&!history.length&&!pages[current].parent;document.querySelector('#content').innerHTML=q?`<div class="card">${Object.entries(pages).filter(([id,p])=>(p.title+' '+p.html().replace(/<[^>]*>/g,' ')).toLowerCase().includes(q)).map(([id,p])=>link(p.title,pages[root(id)].title,id)).join('')||'<div class="empty">No matching settings</div>'}</div>`:pages[current].html();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{history.push(current);current=b.dataset.page;document.querySelector('#search').value='';render();document.querySelector('main').scrollTop=0});document.querySelectorAll('[data-key]').forEach(c=>c.onchange=()=>{if(['browser','email','files','text','pdf'].includes(c.dataset.key))undo={...values};values[c.dataset.key]=c.type==='checkbox'?c.checked:c.value;render()});const u=document.querySelector('#undo');if(u)u.onclick=()=>{values=undo;undo=null;render()}}
document.querySelector('#back').onclick=()=>{document.querySelector('#search').value='';current=history.pop()||pages[current].parent||current;render()};document.querySelector('#search').oninput=render;render();
</script>
</html>
